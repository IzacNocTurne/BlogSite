<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title th:text="${(status == 404 ? '페이지를 찾을 수 없습니다' : '오류가 발생했습니다') + ' - 부동산 정보 분석 블로그'}">오류 - 부동산 정보 분석 블로그</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar('none')}"></nav>

<div class="container my-5 py-5 text-center">
    <h1 class="h3 fw-bold mb-3" th:text="${status == 404 ? '페이지를 찾을 수 없습니다' : '오류가 발생했습니다'}">오류가 발생했습니다</h1>
    <p class="text-muted mb-4" th:text="${status == 404 ? '주소가 잘못되었거나 삭제된 페이지입니다.' : '잠시 후 다시 시도해 주세요.'}">잠시 후 다시 시도해 주세요.</p>
    <a href="/" class="btn btn-primary">홈으로 돌아가기</a>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
