<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title th:text="${selectedCategory != null ? selectedCategory.name + ' - 부동산 정보 분석 블로그' : '부동산 정보 분석 블로그'}">부동산 정보 분석 블로그</title>
    <meta name="description" th:content="${selectedCategory != null ? selectedCategory.name + ' 관련 재건축·재개발 정비사업 정보 모음입니다.' : '서울 및 수도권 재건축·재개발 정비사업 정보를 분석하는 블로그입니다.'}">

    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${selectedCategory != null ? selectedCategory.name + ' - 부동산 정보 분석 블로그' : '부동산 정보 분석 블로그'}">
    <meta property="og:description" content="서울 및 수도권 재건축·재개발 정비사업 정보를 분석하는 블로그입니다.">
    <meta property="og:image" th:content="${baseUrl + '/css/default-og-image.png'}">
    <meta property="og:url" th:content="${#httpServletRequest.requestURL}">
    <link rel="canonical" th:href="${#httpServletRequest.requestURL}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar('home')}"></nav>

<main class="container page-narrow mt-4 mt-md-5">
    <header class="mb-4">
        <h1 class="h3 fw-bold mb-1" th:text="${selectedCategory != null ? selectedCategory.name : '최신 글'}">최신 글</h1>
        <p class="text-muted mb-0">서울·수도권 재건축과 재개발 정비사업 소식을 정리하고 분석합니다.</p>
    </header>

    <!-- 카테고리 바로가기 -->
    <nav th:if="${!#lists.isEmpty(categories)}" class="category-pills mb-4" aria-label="카테고리">
        <a href="/" class="btn btn-sm rounded-pill"
           th:classappend="${selectedCategory == null} ? 'btn-dark' : 'btn-outline-secondary'">전체</a>
        <a th:each="category : ${categories}" th:href="@{/category/{id}(id=${category.id})}" th:text="${category.name}"
           class="btn btn-sm rounded-pill"
           th:classappend="${selectedCategory != null and selectedCategory.id == category.id} ? 'btn-dark' : 'btn-outline-secondary'">카테고리</a>
    </nav>

    <!-- 글 목록: 제목, 요약, 날짜만 보여 주고 본문은 글 페이지에서 -->
    <div class="post-list">
        <article th:each="p : ${postsPage.content}" class="post-list-item">
            <div class="small text-muted mb-1">
                <span th:if="${p.category != null}" th:text="${p.category.name}" class="text-primary fw-semibold">카테고리</span>
                <span th:if="${p.category != null}" class="mx-1">·</span>
                <time th:datetime="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}" th:text="${#temporals.format(p.createdAt, 'yyyy년 M월 d일')}">2026년 11월 8일</time>
            </div>
            <h2 class="h5 fw-bold mb-2">
                <a th:href="@{/post/{id}(id=${p.id})}" th:text="${p.title}" class="stretched-link text-dark text-decoration-none">게시물 제목</a>
            </h2>
            <p class="text-muted mb-0 post-excerpt" th:text="${@markdown.excerpt(p.content, 160)}">요약</p>
        </article>
        <div th:if="${postsPage.isEmpty()}" class="text-center py-5 text-muted">작성된 게시글이 없습니다.</div>
    </div>

    <!-- 페이징 네비게이션 -->
    <nav th:if="${postsPage.totalPages > 1}" aria-label="페이지 이동" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!postsPage.hasPrevious()} ? 'disabled'">
                <a th:if="${postsPage.hasPrevious()}" class="page-link" th:href="@{${selectedCategory != null ? '/category/' + selectedCategory.id : '/'}(page=${postsPage.number - 1})}">&laquo; 이전</a>
                <span th:unless="${postsPage.hasPrevious()}" class="page-link">&laquo; 이전</span>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${(postsPage.number + 1) + ' / ' + postsPage.totalPages}">1 / 5</span>
            </li>
            <li class="page-item" th:classappend="${!postsPage.hasNext()} ? 'disabled'">
                <a th:if="${postsPage.hasNext()}" class="page-link" th:href="@{${selectedCategory != null ? '/category/' + selectedCategory.id : '/'}(page=${postsPage.number + 1})}">다음 &raquo;</a>
                <span th:unless="${postsPage.hasNext()}" class="page-link">다음 &raquo;</span>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
