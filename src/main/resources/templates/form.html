<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시물 작성/수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar('none')}"></nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">
                    카테고리
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:each="category : ${categories}">
                        <a th:href="@{/category/{id}(id=${category.id})}" th:text="${category.name}" class="text-decoration-none text-dark"></a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card">
                <div class="card-body">
                    <h1 class="card-title" th:text="${post.id == null} ? '새 게시물 작성' : '게시물 수정'">게시물 작성</h1>
                    <form th:action="@{/post}" th:object="${post}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{createdAt}" />
                        <input type="hidden" th:field="*{imagePath}" />
                        <div class="mb-3">
                            <label for="category" class="form-label">카테고리</label>
                            <select class="form-control" id="category" th:field="*{category}">
                                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="title" class="form-label">제목</label>
                            <input type="text" class="form-control" id="title" th:field="*{title}" required>
                        </div>
                        <div class="mb-3">
                            <label for="author" class="form-label">작성자</label>
                            <input type="text" class="form-control" id="author" th:field="*{author}" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">내용</label>
                            <textarea class="form-control font-monospace" id="content" rows="24" th:field="*{content}" maxlength="20000" required></textarea>
                            <div class="form-text">
                                마크다운 서식을 쓸 수 있습니다: <code>## 소제목</code>, <code>**굵게**</code>, <code>- 목록</code>, <code>[링크 글자](https://주소)</code>, 표(<code>| 항목 | 내용 |</code> 다음 줄에 <code>|---|---|</code>). 주소만 적어도 링크가 됩니다.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="file" class="form-label">이미지</label>
                            <div th:if="${post.imagePath != null}" class="mb-2">
                                <img th:src="@{/uploads/{path}(path=${post.imagePath})}" class="img-thumbnail" style="max-height: 150px;" alt="Current Image">
                                <span class="text-muted d-block small">현재 등록된 이미지</span>
                            </div>
                            <input type="file" class="form-control" id="file" name="file">
                        </div>
                        <button type="submit" class="btn btn-primary">저장</button>
                        <a href="/" class="btn btn-secondary">취소</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
