<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- 모든 공개 페이지가 함께 쓰는 상단 메뉴. active: home, posts, about, contact, privacy -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top site-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">부동산 정보 분석 블로그</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'posts'} ? 'active'" href="/prologue">전체 글</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'about'} ? 'active'" href="/about">소개</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'contact'} ? 'active'" href="/contact">연락처</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'privacy'} ? 'active'" href="/privacy">개인정보처리방침</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link text-primary" href="/post/new">새 게시물 작성</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link text-primary" href="/category/manage">카테고리 관리</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link text-primary" href="/admin/stats">관리자 통계</a></li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="site-footer mt-5 py-4 bg-light border-top">
    <div class="container text-center">
        <ul class="nav justify-content-center mb-2">
            <li class="nav-item"><a class="nav-link text-muted" href="/prologue">전체 글</a></li>
            <li class="nav-item"><a class="nav-link text-muted" href="/about">소개</a></li>
            <li class="nav-item"><a class="nav-link text-muted" href="/contact">연락처</a></li>
            <li class="nav-item"><a class="nav-link text-muted" href="/privacy">개인정보처리방침</a></li>
        </ul>
        <div class="text-muted small">
            &copy; 2026 부동산 정보 분석 블로그
            <span class="mx-1">|</span>
            <a href="/rss" class="text-muted text-decoration-none">RSS 피드</a>
            <span class="mx-1">|</span>
            <a href="/sitemap.xml" class="text-muted text-decoration-none">사이트맵</a>
        </div>
    </div>
</footer>

<!-- 공통 스크립트 (햄버거 메뉴 동작에 필요) -->
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
