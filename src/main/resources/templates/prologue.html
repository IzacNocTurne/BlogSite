<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체 글 - 부동산 정보 분석 블로그</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <style>
        .post-excerpt {
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 4; /* 4줄 제한 */
            -webkit-box-orient: vertical;
            line-height: 1.5;
            height: 6em; /* line-height * line-clamp */
        }
    </style>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar('posts')}"></nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-12 mb-4">
            <h1 class="h3 fw-bold border-bottom pb-2">전체 글</h1>
            <p class="text-muted">지금까지 올린 재건축·재개발 글을 모두 모았습니다.</p>
        </div>
    </div>
    
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div th:each="post : ${posts}" class="col">
            <div class="card h-100 shadow-sm border-0">
                <a th:href="@{/post/{id}(id=${post.id})}" class="text-decoration-none">
                    <img th:if="${post.imagePath != null and post.imagePath != ''}" th:src="@{/uploads/{imagePath}(imagePath=${post.imagePath})}" 
                         class="card-img-top" alt="게시물 이미지" style="height: 200px; object-fit: cover;">
                </a>
                <div class="card-body">
                    <h5 class="card-title fw-bold">
                        <a th:href="@{/post/{id}(id=${post.id})}" th:text="${post.title}" class="text-decoration-none text-dark">게시물 제목</a>
                    </h5>
                    <p class="card-text text-muted post-excerpt" th:text="${@markdown.excerpt(post.content, 200)}">게시물 본문 미리보기 내용이 이곳에 표시됩니다.</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2026-03-18</small>
                        <a th:href="@{/post/{id}(id=${post.id})}" class="btn btn-sm btn-outline-primary">더 보기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
