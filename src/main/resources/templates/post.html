<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title th:text="${post.title + ' - 부동산 정보 분석 블로그'}">게시물 제목 - 부동산 정보 분석 블로그</title>
    <meta name="description" th:content="${@markdown.excerpt(post.content, 150)}">

    <meta property="og:type" content="article">
    <meta property="og:title" th:content="${post.title}">
    <meta property="og:description" th:content="${@markdown.excerpt(post.content, 100)}">
    <meta property="og:image" th:content="${baseUrl + (post.imagePath != null and post.imagePath != '' ? '/uploads/' + post.imagePath : '/css/default-og-image.png')}">
    <meta property="og:url" th:content="${#httpServletRequest.requestURL}">
    <link rel="canonical" th:href="${#httpServletRequest.requestURL}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar('post')}"></nav>

<main class="container page-narrow mt-4 mt-md-5">
    <article>
        <header class="mb-4">
            <a th:if="${post.category != null}" th:href="@{/category/{id}(id=${post.category.id})}" th:text="${post.category.name}"
               class="small fw-semibold text-primary text-decoration-none">카테고리</a>
            <h1 class="post-title fw-bold mt-1 mb-3" th:text="${post.title}">게시글 제목</h1>
            <div class="text-muted small">
                <span th:text="${post.author}">작성자</span>
                <span class="mx-1">·</span>
                <time th:datetime="${#temporals.format(post.createdAt, 'yyyy-MM-dd''T''HH:mm')}" th:text="${#temporals.format(post.createdAt, 'yyyy년 M월 d일 HH:mm')}">2026년 11월 8일 12:00</time>
                <span class="mx-1">·</span>
                <span th:text="'조회수 ' + ${post.viewCount}">조회수 0</span>
            </div>
        </header>

        <div th:if="${post.imagePath != null and post.imagePath != ''}" class="mb-4 text-center">
            <img th:src="@{/uploads/{path}(path=${post.imagePath})}" class="img-fluid rounded" style="max-height: 500px;" th:alt="${post.title}">
        </div>

        <div class="post-content" th:utext="${@markdown.toHtml(post.content)}">게시글 본문</div>

        <div sec:authorize="hasRole('ADMIN')" class="mt-5 pt-3 border-top text-end">
            <a th:href="@{/post/edit/{id}(id=${post.id})}" class="btn btn-outline-secondary btn-sm">수정</a>
            <form th:action="@{/post/delete/{id}(id=${post.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
            </form>
        </div>
    </article>

    <!-- 본문을 다 읽은 뒤 이어서 볼 글 -->
    <section th:if="${!#lists.isEmpty(relatedPosts)}" class="related-posts mt-5 pt-4 border-top">
        <h2 class="h5 fw-bold mb-3" th:text="${post.category != null ? post.category.name + '의 다른 글' : '최근 글'}">다른 글</h2>
        <ul class="list-unstyled mb-3">
            <li th:each="p : ${relatedPosts}" class="d-flex justify-content-between gap-3 py-2 border-bottom">
                <a th:href="@{/post/{id}(id=${p.id})}" th:text="${p.title}" class="text-dark text-decoration-none">글 제목</a>
                <small class="text-muted text-nowrap" th:text="${#temporals.format(p.createdAt, 'yyyy.MM.dd')}">2026.11.08</small>
            </li>
        </ul>
        <a href="/prologue" class="btn btn-outline-secondary btn-sm">전체 글 보기</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
