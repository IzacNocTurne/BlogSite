name: Java CI/CD with Maven and GCP VM Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub 저장소에서 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. JDK 11 설정 (프로젝트의 Java 버전에 맞춤)
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven' # Maven 의존성 라이브러리 캐싱으로 빌드 속도 단축

    # 3. Maven을 사용하여 빌드 및 테스트 수행 (JAR 파일 빌드)
    - name: Build with Maven
      run: |
        chmod +x mvnw
        ./mvnw clean package

    # 4. 빌드된 JAR 파일을 GCP VM 서버로 SCP 전송
    - name: Copy JAR file to GCP VM via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.GCP_VM_HOST }}
        username: ${{ secrets.GCP_VM_USERNAME }}
        key: ${{ secrets.GCP_VM_SSH_KEY }}
        port: 22
        source: "target/blog-0.0.1-SNAPSHOT.jar"
        target: "~/app"
        strip_components: 1 # 'target/' 폴더 경로를 떼어내고 파일만 전송

    # 5. SSH로 GCP VM에 원격 접속하여 애플리케이션 프로세스 재시작
    - name: SSH Remote Command Execution to Restart Application
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.GCP_VM_HOST }}
        username: ${{ secrets.GCP_VM_USERNAME }}
        key: ${{ secrets.GCP_VM_SSH_KEY }}
        port: 22
        script: |
          set -e
          echo "==== Starting deployment on GCP VM ===="

          # 실행 옵션(DB 경로, 메모리)은 서버에 설치된 blog.service에서 관리합니다. (deploy/blog.service 참고)
          echo "Restarting blog service..."
          sudo systemctl restart blog

          # 앱이 실제로 응답할 때까지 최대 3분 대기
          for i in $(seq 1 36); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "Deployment Completed Successfully!"
              exit 0
            fi
            sleep 5
          done

          echo "Application did not respond within 3 minutes."
          sudo systemctl status blog --no-pager || true
          tail -n 50 ~/app/app.log
          exit 1
